org.gradle.jvmargs=-Xmx900m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# 本机为 aarch64：AGP 默认会从 Maven 下载 x86_64 版 aapt2，无法在此运行，
# 改为使用本地 build-tools 中的 aapt2 可执行文件
android.aapt2FromMavenOverride=/workspace/android-sdk/build-tools/34.0.0/aapt2
